<div style="width: 300px; margin: 100px auto; display: flex; flex-direction: column">
  <nz-select [ngModel]="value()" (ngModelChange)="changeValue($event)">
    <nz-option nzValue="jack" nzLabel="Jack" />
    <nz-option nzValue="lucy" nzLabel="Lucy" />
    <nz-option nzValue="lucy1" nzLabel="Lucy1" />
    <nz-option nzValue="lucy2" nzLabel="Lucy2" />
  </nz-select>

  <div style="margin-top: 10px">The Value: {{ value() }}</div>

  <div style="margin-top: 10px; color: red">
    When I select "lucy1", i want user to confirm is it correct or not, if user click "Confirm", the
    value will be changed. but now, the value will be changed directly without confirmation.
  </div>
</div>
